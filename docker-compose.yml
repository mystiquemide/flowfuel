services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowfuel
      POSTGRES_PASSWORD: flowfuel
      POSTGRES_DB: flowfuel
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowfuel -d flowfuel"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:1.123.77
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DB_SQLITE_POOL_SIZE: "2"
      GENERIC_TIMEZONE: UTC
      DB_TYPE: sqlite
      # Token n8n presents to POST /api/runs. The workflow JSON reads it as
      # $env.FLOWFUEL_WORKFLOW_TOKEN so no secret lives in the workflow file.
      FLOWFUEL_WORKFLOW_TOKEN: ${FLOWFUEL_WORKFLOW_TOKEN:-}
      # Broker address reachable from inside the container.
      FLOWFUEL_BROKER_URL: ${FLOWFUEL_BROKER_URL:-http://host.docker.internal:4010}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
